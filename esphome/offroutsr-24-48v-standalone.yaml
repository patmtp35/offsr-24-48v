##################################
# OffGrid Routeur STANDALONE (sans Home Assistant) — v2.7
# Batterie 24 V ou 48 V (flag battery_nominal) + LSA (0–10 V via GP8403)
# SmartShunt Victron lu en Bluetooth, PZEM-004T pour la puissance réelle
##################################
# - Aucun !secret : tout se règle dans les substitutions en tête de fichier.
# - api: sans chiffrement et ota: sans mot de passe (choix assumé pour un réseau
#   privé de confiance) ; à renforcer si l'ESP32 est sur un réseau moins sûr.
# - time: en sntp (aucune dépendance à Home Assistant pour l'heure).
# - Le composant offsr patché est fourni dans components/offsr/ (voir README.md).
##################################

substitutions:
  name: "offroutsr-esp"
  esphome_name: "OffRoutSr-Esp"
  friendly_name: "OffGrid Routeur Standalone"

  sensor_prefix: "offsrt"

  # Tension nominale du pack : "24" ou "48" (choisit les seuils par défaut du routeur)
  battery_nominal: "24"

  device_description: "Prod Routeur Offgrid - ${battery_nominal} V + LSA - 100% standalone"
  time_timezone: "Europe/Paris"
  projectname: "Pat.OffSrT"
  appversion: "2.7-standalone"

  log_level: "VERBOSE"
  baud_ratelog: "0"

  # ===== A REMPLIR (ex-secrets.yaml, tout est ici maintenant) =====
  wifi_ssid: "A_REMPLIR"
  wifi_password: "A_REMPLIR"
  ap_password: "A_REMPLIR"          # mot de passe du point d'accès de secours (8 car. min)

  # Adressage IP fixe de l'ESP32
  adress_ip: "192.168.X.X"
  gateway_ip: "192.168.X.1"
  dns_ip: "192.168.X.1"

  # SmartShunt Victron (VictronConnect > infos produit > encryption data)
  smartshunt_mac: "AA:BB:CC:DD:EE:FF"
  smartshunt_bindkey: "A_REMPLIR_32_CARACTERES_HEX"
  # =================================================================

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  project:
    name: ${projectname}
    version: ${appversion}

###################################
### Réseau, API, OTA, logs, divers — repris tel quel de commonv2.yaml
### (juste inlinés, plus de fichier externe)
###################################
wifi:
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
      priority: 0
      ### maison

  manual_ip:
    static_ip: ${adress_ip}
    gateway: ${gateway_ip}
    subnet: 255.255.255.0
    dns1: ${dns_ip}
  ap:
    password: ${ap_password}
  min_auth_mode: WPA2

mdns:
  disabled: false

logger:
  level: ${log_level}
  baud_rate: ${baud_ratelog}

api:

captive_portal:

ota:
  - platform: esphome

web_server:
  local: true
  port: 80
  version: 3

# Heure locale sans dépendance HA (seul écart volontaire vs commonv2 :
# remplace platform: ${time_platform} / id: ${time_id})
time:
  - platform: sntp
    id: sntp_time
    timezone: ${time_timezone}

# Position solaire (utile seulement si tu utilises le soleil dans tes automatisations)
sun:
  latitude: 0.000000   # <-- METS TES COORDONNEES
  longitude: 0.000000  # <-- METS TES COORDONNEES

button:
  - platform: restart
    name: "${sensor_prefix} - Restart Esp"
    web_server:
      sorting_weight: 900

###################################
### Composants externes (offsr patché en LOCAL + gp8403 de Seby)
###################################
# offsr : version patchée 24/48 V (flag battery_nominal, bornes des seuils élargies à 20-64 V),
# fournie dans le dossier "components/offsr/" à côté de ce yaml (voir README.md).
# L'original de Seby borne ces 3 seuils à 45-60 V (pack ~48 V) : inutilisable tel quel en 24 V.
external_components:
  - source:
      type: local
      path: components
    components: [offsr]

  - source: "github://SeByDocKy/myESPhome/"
    components: [gp8403]
    refresh: 0s

  # Lecteur Bluetooth (protocole d'annonce) du SmartShunt Victron
  - source: github://Fabian-Schmidt/esphome-victron_ble
    refresh: 0s

###################################
### Bus I2C pour GP8403
###################################
i2c:
  - id: i2c_bus
    sda: GPIO22
    scl: GPIO21
    scan: true
    frequency: 800kHz

gp8403:
  - id: gp8403_id
    voltage: 10V
    i2c_id: i2c_bus
    # Corrigé : ton scan I2C au boot trouve le module à 0x5F, pas 0x58
    # (log : "Found device at address 0x5F" vs "gp8403 Address: 0x58" ->
    # NACK sur chaque écriture DAC, sortie figée à 0).
    address: 0x5F
    gp8413: true

output:
  - platform: gp8403
    gp8403_id: gp8403_id
    id: output_gp8403
    channel: 0

# Commande manuelle de la puissance (curseur 0-100 % -> sortie 0-1 du GP8403).
# A utiliser UNIQUEMENT avec manual_override = ON : offsr n'écrit alors plus
# la sortie, le curseur prend la main. Hors manual_override, offsr et ce
# curseur écrivent sur la même sortie : le dernier gagne, donc ne pas y toucher.
fan:
  - platform: speed
    id: manual_power
    name: ${sensor_prefix}_manual_power
    output: output_gp8403
    speed_count: 100
    restore_mode: ALWAYS_OFF   # jamais de sortie forcée au démarrage
    web_server:
      sorting_weight: 25

###################################
### UART -> PZEM (RS485/Modbus) : puissance réelle injectée dans le
### ballon, utilisée pour détecter une coupure du thermostat mécanique
### (le SmartShunt, lui, n'est plus câblé : voir bloc Bluetooth ci-dessous)
###################################
uart:
  - id: uart_pzem
    tx_pin: GPIO19   # ESP TX -> RX du PZEM
    rx_pin: GPIO18   # ESP RX <- TX du PZEM
    baud_rate: 9600
    stop_bits: 2

modbus:
  id: modbus2
  uart_id: uart_pzem

###################################
### Bluetooth -> SmartShunt (protocole d'annonce Victron, sans fil)
### mac_address / bindkey : à récupérer dans VictronConnect puis à
### renseigner dans les substitutions en tête de fichier
###################################
esp32_ble_tracker:

victron_ble:
  - id: smartshunt_ble
    mac_address: ${smartshunt_mac}
    bindkey: ${smartshunt_bindkey}

###################################
### OffSR : cœur du routeur PV → LSA
###################################
offsr:
  - id: my_offsr1
    battery_current_id: bc_smoothed
    battery_voltage_id: bv
    output_id: output_gp8403
    power_id: pzem_power
    battery_nominal: ${battery_nominal}   # 24 ou 48 : seuils par défaut starting/charged/discharged

###################################
### Binary sensors
###################################
binary_sensor:
  - platform: offsr
    offsr_id: my_offsr1
    thermostat_cut:
      name: ${sensor_prefix}_thermostat_cut

  - platform: status
    name: "${sensor_prefix} - Status Esp"

###################################
### SENSORS
###################################
sensor:
  - platform: offsr
    offsr_id: my_offsr1
    error:
      name: ${sensor_prefix}_regulation_error
    output:
      name: ${sensor_prefix}_output_value
      accuracy_decimals: 3
    target:
      name: ${sensor_prefix}_target_current

  # SmartShunt en Bluetooth (protocole d'annonce Victron) — timeout
  # à 120s : si aucune trame reçue pendant 2 min, passe à NAN plutôt
  # que de garder une valeur figée.
  - platform: victron_ble
    victron_ble_id: smartshunt_ble
    name: ${sensor_prefix}_battery_voltage
    id: bv
    type: BATTERY_VOLTAGE
    filters:
      - timeout: 120s

  - platform: victron_ble
    victron_ble_id: smartshunt_ble
    name: ${sensor_prefix}_battery_current
    id: bc_raw
    type: BATTERY_CURRENT
    filters:
      - timeout: 120s

  - platform: wifi_signal
    name: ${sensor_prefix}_wifi_signal
    id: wifi_power
    update_interval: 5s

  - platform: uptime
    id: uptime_sec

  # Smoothing du courant batterie (obligatoire pour un PID stable),
  # rebranché sur la vraie mesure SmartShunt (bc_raw)
  - platform: copy
    source_id: bc_raw
    name: ${sensor_prefix}_battery_current_smoothed
    id: bc_smoothed
    filters:
      - sliding_window_moving_average:
          window_size: 5

  # Puissance réellement injectée dans le ballon (détection coupure
  # thermostat, cf. binary_sensor thermostat_cut)
  - platform: pzemac
    address: 1
    modbus_id: modbus2
    # Diagnostic câblage : tension ~230 V = L/N bien alimenté ; 0 V = problème 220 V
    voltage:
      name: ${sensor_prefix}_pzem_voltage
    current:
      name: ${sensor_prefix}_pzem_current
    power_factor:
      name: ${sensor_prefix}_pzem_power_factor
    power:
      name: ${sensor_prefix}_power_feedback
      unit_of_measurement: W
      accuracy_decimals: 1
      id: pzem_power

###################################
### SWITCHS OFFSR
###################################
switch:
  - platform: offsr
    offsr_id: my_offsr1
    activation:
      name: ${sensor_prefix}_activation
      id: activation
      web_server:
        sorting_weight: 10
    manual_override:
      name: ${sensor_prefix}_manual_override
      id: manual_override
      web_server:
        sorting_weight: 20
    pid_mode:
      name: ${sensor_prefix}_pid_mode
      id: pid_mode
      web_server:
        sorting_weight: 30
    reverse:
      name: ${sensor_prefix}_reverse
      id: reverse
      web_server:
        sorting_weight: 40

###################################
### Multiplicateur de gains PID (sélecteur grossier : 10 / 1 / 0.1 / 0.01)
###################################
select:
  - platform: offsr
    offsr_id: my_offsr1
    coeff_multiplier:
      name: ${sensor_prefix}_coeff_multiplier
      web_server:
        sorting_weight: 165

###################################
### RÉGLAGES PID + seuils batterie
###################################
number:
  - platform: offsr
    offsr_id: my_offsr1
    charging_setpoint:
      name: ${sensor_prefix}_charging_setpoint
      id: offrt_charging_setpoint
      web_server:
        sorting_weight: 100
    absorbing_setpoint:
      name: ${sensor_prefix}_absorbing_setpoint
      id: offrt_absorbing_setpoint
      web_server:
        sorting_weight: 110
    floating_setpoint:
      name: ${sensor_prefix}_floating_setpoint
      id: offrt_floating_setpoint
      web_server:
        sorting_weight: 120
    starting_battery_voltage:
      name: ${sensor_prefix}_starting_battery_voltage
      id: offrt_starting_battery_voltage
      web_server:
        sorting_weight: 60
    charged_battery_voltage:
      name: ${sensor_prefix}_charged_battery_voltage
      id: offrt_charged_battery_voltage
      web_server:
        sorting_weight: 80
    discharged_battery_voltage:
      name: ${sensor_prefix}_discharged_battery_voltage
      id: offrt_discharged_battery_voltage
      web_server:
        sorting_weight: 70
    kp:
      name: ${sensor_prefix}_kp
      id: offrt_kp
      web_server:
        sorting_weight: 140
    ki:
      name: ${sensor_prefix}_ki
      id: offrt_ki
      web_server:
        sorting_weight: 150
    kd:
      name: ${sensor_prefix}_kd
      id: offrt_kd
      web_server:
        sorting_weight: 160
    output_min:
      name: ${sensor_prefix}_output_min
      id: offrt_output_min
      web_server:
        sorting_weight: 180
    output_max:
      name: ${sensor_prefix}_output_max
      id: offrt_output_max
      web_server:
        sorting_weight: 190
    output_restart:
      name: ${sensor_prefix}_output_restart
      id: offrt_output_restart
      web_server:
        sorting_weight: 200
